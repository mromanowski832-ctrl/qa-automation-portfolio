name: QA Automation

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    name: Selenium + TestNG regression
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Run UI regression in headless Chrome
        run: mvn -B -ntp clean test -Dbrowser=chrome -Dheadless=true -Drun.mode=local

      - name: Upload TestNG and Surefire reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: qa-test-reports
          path: |
            target/surefire-reports/
            test-output/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload failure screenshots
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: failure-screenshots
          path: screenshots/
          if-no-files-found: ignore
          retention-days: 14
